# Runs myPiggyBank for daily use.  docker compose up -d  →  http://localhost:8080
# Your data lives on the host in ./data/piggybank.db (git-ignored).
services:
  app:
    build: .
    image: mypiggybank:latest
    restart: unless-stopped
    ports:
      # APP_BIND: the address it answers on. 127.0.0.1 (default) = this machine only; on a
      # server, its VPN address (e.g. the WireGuard one) = only devices on the VPN.
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:3001'
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      # "Today" for recurring transactions and snapshots (the container clock is UTC otherwise).
      TZ: ${TZ:-Europe/Berlin}
      RATES_URL: ${RATES_URL:-https://api.frankfurter.dev/v1}
      # AI suggestions (Claude): no key = no AI. Each family still switches it on in Settings.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_MONTHLY_TOKENS: ${AI_MONTHLY_TOKENS:-2000000}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
